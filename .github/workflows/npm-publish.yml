name: Publish package to NPM

# Manual trigger only on this fork (publishes @davidabou/icons).
# Manual trigger only; restore the push trigger to re-enable automatic publishing.
on:
  workflow_dispatch:

# Publishing uses npm Trusted Publishing (OIDC): no NPM_TOKEN secret is needed,
# but this workflow must be registered as a trusted publisher on npmjs.com.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      # Trusted Publishing needs npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@latest

      - uses: oven-sh/setup-bun@v2

      - run: bun install
      - run: bun run build

      # Release candidates go to the "next" tag, everything else to "latest"
      - name: Pick the npm dist-tag
        id: tag
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$version" == *-rc* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - run: npm publish --access public --tag ${{ steps.tag.outputs.tag }}

      # Rebuild the website (icons.abou.dev) so the new icons show the version they shipped in.
      # VERCEL_DEPLOY_HOOK: Vercel project → Settings → Git → Deploy Hooks (branch master)
      - name: Rebuild the website
        if: env.VERCEL_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
