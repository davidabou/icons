name: Release

# Manual trigger only (Actions → Release → Run workflow). In order:
#   1. version: computes the next version from the Conventional Commits since the last release
#      (or takes the bump chosen below, see .github/scripts/release.ts), checks the build, then commits "chore: release x.y.z" and tags vx.y.z
#   2. publish: publishes @davidabou/icons, @davidabou/icons-vue, @davidabou/icons-react, then
#      @davidabou/nuxt-icons (which depends on icons-vue), skipping the versions already on npm
#   3. release: creates the GitHub Release with changelogithub (features, fixes, performance and breaking changes,
#      with their contributors), and rebuilds the website
# A failed job can be re-run alone: publishing skips what is already on npm.
#
# This file keeps the name npm-publish.yml: it is the workflow registered as the npm trusted publisher
# of each package on npmjs.com (Trusted Publishing, OIDC: no NPM_TOKEN secret).
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (auto: from the commits, feat → minor, fix → patch, breaking → major; before 1.0: breaking → minor, feat and fix → patch)'
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.next.outputs.version }}
      base: ${{ steps.next.outputs.base }}
      notes-filter: ${{ steps.next.outputs.notes-filter }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - uses: oven-sh/setup-bun@v2

      # Last release, and next version from the commits since then (or from the chosen bump)
      - name: Compute the next version
        id: next
        run: bun .github/scripts/release.ts next-version ${{ inputs.bump }}

      - run: bun install --frozen-lockfile

      - name: Set the version of all packages
        run: bun run set-version ${{ steps.next.outputs.version }}

      # Nothing is committed or tagged unless the whole build passes
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - run: bun run vue:test
      - run: bun run react:test

      - name: Type-check the Nuxt module and its playground
        run: bun run dev:prepare && bun run test:types
        working-directory: packages/nuxt

      - name: Commit and tag the release
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json packages/vue/package.json packages/react/package.json packages/nuxt/package.json
          git commit -m "chore: release $VERSION"
          git tag "v$VERSION"
          git push --atomic origin HEAD:master "v$VERSION"

  publish:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.version.outputs.version }}

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      # Trusted Publishing needs npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@latest

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      # Core package (also regenerates packages/vue/src/icons.ts and packages/react/src/icons.ts), then the Vue and React packages
      - run: bun run build
      - run: bun run build
        working-directory: packages/vue
      - run: bun run build
        working-directory: packages/react

      # The prepack script (the Nuxt module build) is run with `bun run`, which finds the binaries
      # hoisted to the workspace root (`bun pm pack` does not). `bun pm pack` then replaces the
      # workspace:* dependency on @davidabou/icons-vue with its exact version.
      - name: Publish
        run: |
          mkdir -p "$RUNNER_TEMP/packages"
          for dir in . packages/vue packages/react packages/nuxt; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")

            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "⏭ $name@$version is already published"
              continue
            fi

            if [ -n "$(node -p "require('./$dir/package.json').scripts?.prepack ?? ''")" ]; then
              (cd "$dir" && bun run prepack)
            fi

            tarball=$(cd "$dir" && bun pm pack --quiet --ignore-scripts --destination "$RUNNER_TEMP/packages")
            npm publish "$RUNNER_TEMP/packages/$(basename "$tarball")" --access public
          done

  release:
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.version.outputs.version }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      # Notes from the Conventional Commits since the last release that touch the published packages
      # (--from: needed until the first tag exists, notes-filter: the package paths, from release.ts)
      - name: Create the GitHub Release
        run: bunx changelogithub@15.0.5 --from ${{ needs.version.outputs.base }} --to v${{ needs.version.outputs.version }} ${{ needs.version.outputs.notes-filter }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Rebuild the website (icons.abou.dev) so the new icons show the version they shipped in.
      # VERCEL_DEPLOY_HOOK: Vercel project → Settings → Git → Deploy Hooks (branch master)
      - name: Rebuild the website
        if: env.VERCEL_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
